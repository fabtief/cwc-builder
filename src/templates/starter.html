<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="./libraries/webcc.min.js"></script>
  {{LIB_STYLES}}
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    /* ── layout ─────────────────────────────────────── */
    #cwc-root {
      width: 100%;
      height: 100%;
    }

    /* canvas is hidden by default — enable in code.js   */
    /* with: canvas.style.display = 'block';              */
    #cwc-canvas {
      width: 100%;
      position: absolute;
      bottom: 0;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="cwc-root"></div>
  <canvas id="cwc-canvas"></canvas>

  {{LIB_SCRIPTS}}
  <script src="./code.js"></script>
</body>
</html>
