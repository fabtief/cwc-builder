<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="./libraries/webcc.min.js"></script>
  {{LIB_STYLES}}
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #cwc-root {
      width: 100%;
      height: 100%;
    }
    #cwc-canvas {
      width: 100%;
      position: absolute;
      bottom: 0;
      pointer-events: none; /* canvas must never block clicks on elements below it */
      display: none;        /* hidden by default — enable in code.js if needed */
    }
  </style>
</head>
<body>

  <!-- #cwc-root  → for div-based libraries (DataTables, Tabulator, ApexCharts...) -->
  <!-- #cwc-canvas → for canvas-based libraries (Gauge.js, Chart.js...)            -->
  <!--               Enable in code.js: canvas.style.display = 'block';            -->
  <div id="cwc-root"></div>
  <canvas id="cwc-canvas"></canvas>

  {{LIB_SCRIPTS}}
  <script src="./code.js"></script>
</body>
</html>
